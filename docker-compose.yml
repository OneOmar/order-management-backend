services:

  db:
    image: postgres:15
    container_name: order-db
    restart: always

    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Healthcheck → vérifie que PostgreSQL est prêt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s       # test toutes les 5s
      timeout: 5s        # timeout du test
      retries: 5         # nombre d'essais

  app:
    build: .
    container_name: order-app

    # attend que la DB soit HEALTHY
    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/orderdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    # restart: always  # redémarre automatiquement si crash

volumes:
  postgres_data:
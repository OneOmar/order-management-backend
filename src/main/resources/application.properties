# ------------------------
# Serveur
# ------------------------
server.port=8080

# ------------------------
# Base de données (Postgres)
# ------------------------
# URL pour dev local / docker. En prod, override via env ou application-prod.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari (pooling) — performants et recommandés
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=OrderHikariCP

# ------------------------
# JPA / Hibernate
# ------------------------
# En DEV tu peux mettre "update" ; en PROD laisser "validate" (ne pas auto-update en prod).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ------------------------
# Flyway (migrations)
# ------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------------------------
# JWT (sécurité)
# ------------------------
# Ne jamais hardcoder le secret — lu depuis la variable d'environnement JWT_SECRET
# valeur base64 attendue
jwt.secret=${JWT_SECRET}
# access token en ms (ex: 15min)
jwt.expiration=900000
# refresh token en ms (ex: 7 jours)
jwt.refresh-expiration=604800000

# ------------------------
# Actuator / monitoring
# ------------------------
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=when_authorized

# ------------------------
# Logs
# ------------------------
logging.level.root=INFO
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=WARN

# ------------------------
# Profiles
# ------------------------
# Tu peux définir spring.profiles.active=dev en local si tu veux
# spring.profiles.active=dev
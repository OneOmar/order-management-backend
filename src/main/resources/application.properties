# ------------------------
# Server
# ------------------------
server.port=8080

# ------------------------
# Database (Postgres)
# ------------------------
# Use service name "db" in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (connection pool)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=OrderHikariCP

# ------------------------
# JPA / Hibernate
# ------------------------
# DEV = update | PROD = validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------
# Flyway (migrations)
# ------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------------------------
# JWT (Security)
# ------------------------
# Secret from ENV only (never hardcode)
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# ------------------------
# Actuator / Monitoring
# ------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# ------------------------
# Logging
# ------------------------
logging.level.root=INFO
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=WARN

# ------------------------
# Profiles (optional)
# ------------------------
# spring.profiles.active=dev